[package]
name = "lyrics-sw"
version = "0.1.1"
edition = "2024"
repository = "https://github.com/homemdesgraca/lyrics-sw"

[dependencies]
clap = { version = "4.6.4", features = ["derive"] }
lofty = "0.24.0"
reqwest = { version = "0.13.4", features = ["blocking", "json"] }
serde = { version = "1.0.229", features = ["derive"] }
urlencoding = "2.1.3"
walkdir = "2.5.0"

# The profile that 'dist' will build with
[profile.dist]
inherits = "release"
lto = "thin"
